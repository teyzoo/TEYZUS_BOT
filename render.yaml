services:
  - type: web
    name: teyzus-bot
    runtime: python
    plan: free

    buildCommand: pip install -r requirements.txt

    startCommand: python main.py

    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10

      - key: BOT_TOKEN
        sync: false

      - key: DATABASE_URL
        sync: false

      - key: OWNER_ID
        sync: false

      - key: BOT_NAME
        value: TEYZUS

      - key: BOT_USERNAME
        value: TEYZUS_Bot

      - key: WEB_HOST
        value: 0.0.0.0

      - key: WEB_PORT
        value: 10000

      - key: LOG_LEVEL
        value: INFO
